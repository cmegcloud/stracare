<div class="bg-white border rounded p-5">

    <h2 class="text-xl font-bold mb-5">
        Cash Receipt Entry
    </h2>

    <div class="grid grid-cols-3 gap-4">

        <input
            id="receiptMobile"
            class="border p-2 rounded"
            placeholder="Mobile Number">

        <input
            id="receiptPatient"
            class="border p-2 rounded"
            placeholder="Patient Name"
            readonly>

        <input
            id="receiptAmount"
            class="border p-2 rounded"
            placeholder="Amount">

        <select
            id="receiptMode"
            class="border p-2 rounded">

            <option>Cash</option>
            <option>UPI</option>
            <option>Card</option>
            <option>Bank</option>

        </select>

        <select
            id="receiptBranch"
            class="border p-2 rounded">

            <option value="">
                Select Branch
            </option>

        </select>

        <input
            type="date"
            id="receiptDate"
            class="border p-2 rounded">

    </div>

    <textarea
        id="receiptRemarks"
        class="border p-2 rounded w-full mt-4"
        placeholder="Remarks">
    </textarea>

    <button
        onclick="saveReceipt()"
        class="bg-green-700 text-white px-4 py-2 rounded mt-4">

        Save Receipt

    </button>

</div>

<div class="bg-white border rounded p-5 mt-5">

    <table class="w-full">

        <thead>

        <tr>

            <th>Receipt No</th>
            <th>Date</th>
            <th>Patient</th>
            <th>Mobile</th>
            <th>Mode</th>
            <th>Amount</th>

        </tr>

        </thead>

        <tbody id="receiptTable">

        </tbody>

    </table>

</div>
