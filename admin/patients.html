<div class="card">

<h3 style="margin-bottom:20px;">
Patients Management
</h3>

<div style="
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-bottom:15px;
">

<input id="patientMobile"
placeholder="Mobile Number">

<input id="patientName"
placeholder="Patient Name">

<select id="patientGender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input id="patientAge"
placeholder="Age">

</div>

<textarea
id="patientAddress"
placeholder="Address"
style="
width:100%;
height:70px;
margin-bottom:10px;
">
</textarea>

<textarea
id="patientNotes"
placeholder="Notes"
style="
width:100%;
height:70px;
margin-bottom:15px;
">
</textarea>

<button
onclick="savePatient()"
style="
background:#991b1b;
color:white;
padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
margin-bottom:20px;
">
Save Patient
</button>

<hr style="margin-bottom:20px;">

<table
style="
width:100%;
border-collapse:collapse;
">

<thead>

<tr>

<th style="padding:10px;border-bottom:1px solid #ddd;">
Mobile
</th>

<th style="padding:10px;border-bottom:1px solid #ddd;">
Name
</th>

<th style="padding:10px;border-bottom:1px solid #ddd;">
Gender
</th>

<th style="padding:10px;border-bottom:1px solid #ddd;">
Age
</th>

<th style="padding:10px;border-bottom:1px solid #ddd;">
Action
</th>

</tr>

</thead>

<tbody id="patientsTable">

</tbody>

</table>

</div>
