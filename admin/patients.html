<input id="patientMobile"
placeholder="Mobile Number">

<input id="patientName"
placeholder="Patient Name">

<select id="patientGender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input id="patientAge"
placeholder="Age">

<textarea id="patientAddress"></textarea>

<textarea id="patientNotes"></textarea>

<button onclick="savePatient()">
Save Patient
</button>

<table style="width:100%">
<thead>
<tr>
<th>Mobile</th>
<th>Name</th>
<th>Gender</th>
<th>Age</th>
<th>Action</th>
</tr>
</thead>

<tbody id="patientsTable">
</tbody>

</table>
