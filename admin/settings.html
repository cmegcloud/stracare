<div class="bg-white border rounded p-5">

    <h2 class="text-xl font-bold mb-5">
        Clinic Settings
    </h2>

    <div class="grid grid-cols-2 gap-4">

        <input
            id="clinicName"
            class="border p-2 rounded"
            placeholder="Clinic Name">

        <input
            id="clinicMobile"
            class="border p-2 rounded"
            placeholder="Mobile Number">

        <input
            id="clinicEmail"
            class="border p-2 rounded"
            placeholder="Email">

        <input
            id="clinicWebsite"
            class="border p-2 rounded"
            placeholder="Website">

        <textarea
            id="clinicAddress"
            class="border p-2 rounded col-span-2"
            placeholder="Address">
        </textarea>

    </div>

    <button
        onclick="saveClinicSettings()"
        class="bg-red-700 text-white px-4 py-2 rounded mt-4">

        Save Settings

    </button>

</div>

<!-- Branches -->

<div class="bg-white border rounded p-5 mt-5">

    <h2 class="text-xl font-bold mb-5">
        Branch Management
    </h2>

    <div class="grid grid-cols-3 gap-4">

        <input
            id="branchName"
            class="border p-2 rounded"
            placeholder="Branch Name">

        <input
            id="branchCode"
            class="border p-2 rounded"
            placeholder="Branch Code">

        <input
            id="branchMobile"
            class="border p-2 rounded"
            placeholder="Mobile">

    </div>

    <button
        onclick="saveBranch()"
        class="bg-green-700 text-white px-4 py-2 rounded mt-4">

        Add Branch

    </button>

    <table class="w-full mt-5">

        <thead>

        <tr>

            <th>Branch</th>
            <th>Code</th>
            <th>Mobile</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody id="branchTable">

        </tbody>

    </table>

</div>

<!-- Users -->

<div class="bg-white border rounded p-5 mt-5">

    <h2 class="text-xl font-bold mb-5">
        User Management
    </h2>

    <div class="grid grid-cols-4 gap-4">

        <input
            id="userName"
            class="border p-2 rounded"
            placeholder="User Name">

        <input
            id="userEmail"
            class="border p-2 rounded"
            placeholder="Email">

        <select
            id="userRole"
            class="border p-2 rounded">

            <option>Admin</option>
            <option>Branch User</option>
            <option>Doctor</option>

        </select>

        <select
            id="userBranch"
            class="border p-2 rounded">

        </select>

    </div>

    <button
        onclick="saveUser()"
        class="bg-blue-700 text-white px-4 py-2 rounded mt-4">

        Save User

    </button>

</div>
