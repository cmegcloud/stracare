<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRA CARE ERP</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="css/style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#f8fafc;
overflow:hidden;
}

.sidebar{
width:270px;
background:#ffffff;
border-right:1px solid #e5e7eb;
height:100vh;
position:fixed;
left:0;
top:0;
overflow-y:auto;
z-index:50;
}

.main-content{
margin-left:270px;
height:100vh;
overflow-y:auto;
}

.logo-area{
padding:20px;
border-bottom:1px solid #e5e7eb;
}

.logo-title{
font-size:24px;
font-weight:800;
color:#991b1b;
}

.logo-sub{
font-size:12px;
color:#64748b;
margin-top:4px;
}

.menu-section{
padding:15px;
}

.menu-item{
display:flex;
align-items:center;
gap:12px;
padding:12px 14px;
border-radius:10px;
cursor:pointer;
margin-bottom:4px;
font-size:14px;
font-weight:600;
transition:.2s;
}

.menu-item:hover{
background:#f1f5f9;
}

.menu-item.active{
background:#991b1b;
color:#ffffff;
}

.topbar{
height:70px;
background:#ffffff;
border-bottom:1px solid #e5e7eb;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
position:sticky;
top:0;
z-index:20;
}

.page-title{
font-size:24px;
font-weight:700;
color:#0f172a;
}

.user-box{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:#991b1b;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.content-area{
padding:25px;
}

.card{
background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
}

.kpi-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.kpi-card{
background:white;
border:1px solid #e5e7eb;
border-radius:16px;
padding:20px;
}

.kpi-title{
font-size:13px;
color:#64748b;
font-weight:600;
}

.kpi-value{
font-size:32px;
font-weight:800;
margin-top:10px;
color:#0f172a;
}

@media(max-width:900px){

.sidebar{
left:-270px;
}

.sidebar.show{
left:0;
}

.main-content{
margin-left:0;
}

.kpi-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo-area">

<h1 class="logo-title">
STRA CARE
</h1>

<p class="logo-sub">
Clinic ERP & CRM
</p>

</div>

<div class="menu-section">

<div class="menu-item active"
onclick="loadPage('dashboard')">
📊 Dashboard
</div>

<div class="menu-item"
onclick="loadPage('calendar')">
📅 Calendar
</div>

<div class="menu-item"
onclick="loadPage('appointments')">
🩺 Appointments
</div>

<div class="menu-item"
onclick="loadPage('patients')">
👨‍⚕️ Patients
</div>

<div class="menu-item"
onclick="loadPage('doctors')">
🧑‍⚕️ Doctors
</div>

<div class="menu-item"
onclick="loadPage('receipts')">
💰 Receipts
</div>

<div class="menu-item"
onclick="loadPage('payments')">
💸 Payments
</div>

<div class="menu-item"
onclick="loadPage('receivables')">
📋 Receivables
</div>

<div class="menu-item"
onclick="loadPage('reports')">
📈 Reports
</div>

<div class="menu-item"
onclick="loadPage('settings')">
⚙ Settings
</div>

</div>

</div>

<div class="main-content">

<div class="topbar">

<h2 class="page-title"
id="pageTitle">
Dashboard
</h2>

<div class="user-box">

<div>

<div style="font-weight:700">
Administrator
</div>

<div style="font-size:12px;color:#64748b">
STRA CARE
</div>

</div>

<div class="avatar">
A
</div>

</div>

</div>

<div class="content-area">

<div id="page-content">

<!-- Dashboard loads here -->

</div>

</div>

</div>

<!-- PART 2 -->

<!-- Global Modal -->

<div id="globalModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
z-index:999;
justify-content:center;
align-items:center;
">

<div
style="
background:white;
width:95%;
max-width:900px;
border-radius:18px;
padding:25px;
max-height:90vh;
overflow:auto;
">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
">

<h3 id="modalTitle">
Details
</h3>

<button
onclick="closeModal()"
style="
border:none;
background:#ef4444;
color:white;
padding:8px 15px;
border-radius:10px;
cursor:pointer;
">
Close
</button>

</div>

<div id="modalContent">

</div>

</div>

</div>

<!-- Toast -->

<div id="toast"
style="
position:fixed;
bottom:20px;
right:20px;
background:#16a34a;
color:white;
padding:12px 20px;
border-radius:10px;
display:none;
z-index:9999;
">
Saved Successfully
</div>

<!-- Firebase -->

<script type="module" src="js/firebase.js"></script>

<!-- Main App -->

<script type="module" src="js/app.js"></script>

<script>

async function loadPage(page){

    document.getElementById("pageTitle").innerText =
        page.charAt(0).toUpperCase() +
        page.slice(1);

    try{

        const response =
        await fetch(page + ".html");

        const html =
        await response.text();

        document.getElementById(
            "page-content"
        ).innerHTML = html;

        document
        .querySelectorAll(".menu-item")
        .forEach(item => {

            item.classList.remove("active");

            if(
                item.innerText
                .toLowerCase()
                .includes(page)
            ){
                item.classList.add("active");
            }

        });

    }catch(error){

        console.error(error);

        document.getElementById(
            "page-content"
        ).innerHTML =

        `
        <div class="card">

            <h3 style="color:red">
                Error Loading Page
            </h3>

            <p>
                Could not load:
                ${page}.html
            </p>

        </div>
        `;

    }

}

function showToast(message){

    const toast =
    document.getElementById("toast");

    toast.innerHTML =
    message;

    toast.style.display =
    "block";

    setTimeout(()=>{

        toast.style.display =
        "none";

    },3000);

}

function openModal(title,html){

    document.getElementById(
        "modalTitle"
    ).innerHTML = title;

    document.getElementById(
        "modalContent"
    ).innerHTML = html;

    document.getElementById(
        "globalModal"
    ).style.display = "flex";

}

function closeModal(){

    document.getElementById(
        "globalModal"
    ).style.display = "none";

}

function toggleMenu(){

    document.querySelector(
        ".sidebar"
    ).classList.toggle("show");

}

document.addEventListener(
"DOMContentLoaded",
function(){

    loadPage("dashboard");

});

</script>
</body>

</html>
