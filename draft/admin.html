<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STRA CARE | Admin Dashboard</title>
    
    <link rel="icon" type="image/png" href="https://stracares.in/assets/logo-app.png">
    <meta name="theme-color" content="#1E3A5F">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { colors: { brandTeal: '#009B95', brandNavy: '#1E3A5F', brandDark: '#0f172a' } } } 
        }
    </script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        select, input { outline: none; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDwfmoDPvslFmTn3GjO56VAxhODRlem5bg",
            authDomain: "stra-care.firebaseapp.com",
            projectId: "stra-care",
            storageBucket: "stra-care.firebasestorage.app",
            messagingSenderId: "329966100049",
            appId: "1:329966100049:web:ca8acc0fccdebac5da6270"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans antialiased">

    <nav class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-40 border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="flex items-center gap-3">
                <img src="https://stracares.in/assets/logo-header.png" alt="STRA CARE" class="h-8 md:h-10 w-auto object-contain bg-white px-2 rounded">
                <span class="font-bold text-brandNavy dark:text-white hidden sm:block tracking-widest text-sm border-l-2 border-brandTeal pl-3 ml-2">ADMIN PANEL</span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-xs font-mono bg-brandLight dark:bg-gray-700 text-brandTeal px-3 py-1 rounded shadow-inner" id="adminClock">--:--:--</div>
                <button onclick="toggleTheme()" class="p-2 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-yellow-400 shadow-inner hover:bg-gray-200 transition">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto px-4 py-6">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-blue-500 flex flex-col">
                <span class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase mb-1">Total Slots Booked</span>
                <span class="text-2xl font-bold text-brandNavy dark:text-white" id="dashTotal">0</span>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-yellow-500 flex flex-col">
                <span class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase mb-1">Service Pending</span>
                <span class="text-2xl font-bold text-brandNavy dark:text-white" id="dashPending">0</span>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-green-500 flex flex-col">
                <span class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase mb-1">Service Done</span>
                <span class="text-2xl font-bold text-brandNavy dark:text-white" id="dashDone">0</span>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border-l-4 border-red-500 flex flex-col">
                <span class="text-xs text-gray-500 dark:text-gray-400 font-bold uppercase mb-1">Total Receivables (₹)</span>
                <span class="text-2xl font-bold text-red-600 dark:text-red-400" id="dashReceivables">0</span>
            </div>
        </div>

        <div class="flex flex-wrap gap-3 mb-4 text-xs font-semibold">
            <span class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-white dark:bg-gray-800 border border-gray-300"></div> Pending / Default</span>
            <span class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-blue-100 dark:bg-blue-900 border border-blue-300"></div> Payment Fully Done</span>
            <span class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-purple-100 dark:bg-purple-900 border border-purple-300"></div> Service Done (Payment Pending)</span>
            <span class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-green-100 dark:bg-green-900 border border-green-300"></div> Both Complete</span>
            <span class="flex items-center gap-1"><div class="w-3 h-3 rounded bg-red-100 dark:bg-red-900 border border-red-300"></div> Not Come</span>
        </div>

        <div class="bg-white dark:bg-gray-800 shadow-lg rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-gray-50 dark:bg-gray-900 text-gray-600 dark:text-gray-300 border-b border-gray-200 dark:border-gray-700">
                        <tr>
                            <th class="p-4 font-bold">Trn ID / Date</th>
                            <th class="p-4 font-bold">Patient Details</th>
                            <th class="p-4 font-bold">Branch & Doctor</th>
                            <th class="p-4 font-bold">Fee / Adv / Bal</th>
                            <th class="p-4 font-bold">Service / Payment</th>
                            <th class="p-4 font-bold text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-200 dark:divide-gray-700">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="editModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 transition-opacity duration-300 opacity-0 px-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-brandLight dark:bg-gray-900">
                <h3 class="font-bold text-brandNavy dark:text-white text-lg">Update Appointment</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-4">
                <input type="hidden" id="editDocId">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Service Status</label>
                        <select id="editServiceStatus" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white text-sm">
                            <option value="Pending">Pending</option>
                            <option value="Done">Done</option>
                            <option value="Not Come">Not Come</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Payment Status</label>
                        <select id="editPaymentStatus" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white text-sm">
                            <option value="Pending">Pending</option>
                            <option value="Advance">Advance</option>
                            <option value="Fully Paid">Fully Paid</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Actual Fee (₹)</label>
                        <input type="number" id="editActualFee" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">Advance Received (₹)</label>
                        <input type="number" id="editAdvance" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">UPI Transaction No. (Optional)</label>
                    <input type="text" id="editUpi" placeholder="e.g. 31234567890" class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 bg-gray-50 dark:bg-gray-700 dark:text-white text-sm font-mono">
                </div>
            </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-3 bg-gray-50 dark:bg-gray-900">
                <button onclick="closeModal()" class="px-5 py-2 text-sm font-bold text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition">Cancel</button>
                <button onclick="saveUpdate()" class="px-5 py-2 text-sm font-bold text-white bg-brandTeal hover:bg-teal-700 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Save Changes
                </button>
            </div>
        </div>
    </div>

    <script src="./admin.js"></script>
</body>
</html>
