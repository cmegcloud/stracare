<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STRA CARE Coming Soon | Physiotherapy &amp; Rehabilitation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        
        :root {
            --primary: #1E3A5F;
            --accent: #009B95;
            --light: #F0F8F8;
        }
        
        .page-wrapper {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 50%, #e8f1f0 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 20px;
        }
        
        .animated-blob {
            position: absolute;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            opacity: 0.08;
            animation: blobFloat 8s ease-in-out infinite;
        }
        
        .blob-1 {
            width: 500px;
            height: 500px;
            background: var(--accent);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        
        .blob-2 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            bottom: -50px;
            left: -50px;
            animation-delay: 2s;
        }
        
        @keyframes blobFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        
        .content-wrapper {
            position: relative;
            z-index: 10;
            max-width: 800px;
            width: 100%;
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--accent), #00d4cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 15px 40px rgba(0, 155, 149, 0.25);
            font-size: 50px;
            color: white;
        }
        
        .main-title {
            color: var(--primary);
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0 0 20px;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        
        .subtitle-text {
            color: #555;
            font-size: 1.2rem;
            margin: 0 0 40px;
            line-height: 1.7;
            font-weight: 300;
        }
        
        .countdown-section {
            background: rgba(0, 155, 149, 0.05);
            border: 2px solid rgba(0, 155, 149, 0.15);
            border-radius: 16px;
            padding: 30px;
            margin: 40px 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .countdown-item {
            text-align: center;
        }
        
        .countdown-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent);
        }
        
        .countdown-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        .feature-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            border-color: var(--accent);
        }
        
        .feature-icon {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        
        .feature-title {
            color: var(--primary);
            font-weight: 700;
            margin: 0;
            font-size: 1.1rem;
        }
        
        .cta-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 50px;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00d4cc);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 155, 149, 0.3);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 155, 149, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: var(--accent);
            padding: 18px 40px;
            border: 2px solid var(--accent);
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn-secondary:hover {
            background: var(--light);
            transform: translateY(-3px);
        }
        
        .contact-bar {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-top: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-around;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #333;
            text-decoration: none;
        }
        
        .contact-item i {
            color: var(--accent);
            font-size: 1.5rem;
        }
        
        .contact-text {
            font-weight: 600;
            color: var(--primary);
        }
        
        .footer-credit {
            color: #888;
            font-size: 0.85rem;
            margin-top: 50px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            
            .subtitle-text {
                font-size: 1rem;
            }
            
            .countdown-section {
                gap: 15px;
                padding: 20px;
            }
            
            .countdown-number {
                font-size: 2rem;
            }
            
            .cta-buttons {
                flex-direction: column;
            }
            
            .btn-primary, .btn-secondary {
                width: 100%;
            }
            
            .contact-bar {
                flex-direction: column;
                gap: 16px;
            }
        }
    </style>
  <style>body { box-sizing: border-box; }</style>

        window.elementSdk.init({
