<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CMBooks - Daily Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>

<div class="module-container" id="attendance-module">
    <style>
        :root { --primary: #e16349; --primary-light: #fef5e8; --bg: #F8F5F1; --surface: #ffffff; --text-main: #0a0a0a; --text-muted: #777777; --border: #E8E5E1; --grey-med: #D9D9D9; --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.03); --success: #10B981; --danger: #ef4444; --warning: #FB923C; }
        
        #attendance-module { font-family: 'Inter', sans-serif; width: 100%; max-width: 1120px; }
        #attendance-module .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        
        #attendance-module .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        #attendance-module .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; background: #FAFAFA; }
        
        #attendance-module .btn-primary { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
        #attendance-module .btn-outline { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }

        /* Monthly View Table Styling */
        #monthTable { width: 100%; border-collapse: collapse; font-size: 10px; }
        #monthTable th, #monthTable td { border: 1px solid var(--border); padding: 4px; text-align: center; }
        .st-P { color: var(--success); font-weight: bold; }
        .st-A { color: var(--danger); font-weight: bold; }
        
        @media print {
            body { background: white; padding: 0; }
            #sidebar-container, #header-container, #bottomnav-container, .form-card, .section-title, .no-print { display: none !important; }
            #attendance-module { max-width: 100%; }
            .print-only { display: block !important; }
            #monthTable { font-size: 8px; }
        }
    </style>

    <div class="section-title">
        <h2 style="margin: 0;">Attendance Management</h2>
        <button class="btn-outline no-print" onclick="window.print()">Print A4 Report</button>
    </div>

    <!-- Monthly View Matrix -->
    <div class="form-card no-print">
        <h4 style="margin-bottom: 15px;">Monthly Attendance Report</h4>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="month" id="reportMonth" class="form-input" style="width:auto;" onchange="window.generateMonthlyReport()">
            <button class="btn-primary" onclick="window.generateMonthlyReport()">Generate</button>
        </div>
    </div>

    <div class="table-container print-only" id="monthlyReportArea" style="display:none; padding:20px;">
        <h3 style="margin-bottom:10px;">Monthly Attendance: <span id="reportMonthTitle"></span></h3>
        <table id="monthTable">
            <thead><tr id="monthHead"></tr></thead>
            <tbody id="monthBody"></tbody>
        </table>
    </div>

    <!-- (Keep all existing Daily Attendance Forms and Logs here below as per your original code) -->
    <!-- ... [All existing Daily Attendance form and Table log code] ... -->
    <script type="module">
        // ... (Existing Imports)
        // Add this new report function:
        window.generateMonthlyReport = async function() {
            const monthVal = document.getElementById('reportMonth').value; // YYYY-MM
            if(!monthVal) return;
            document.getElementById('monthlyReportArea').style.display = 'block';
            document.getElementById('reportMonthTitle').innerText = monthVal;
            
            const daysInMonth = new Date(monthVal.split('-')[0], monthVal.split('-')[1], 0).getDate();
            const head = document.getElementById('monthHead');
            const body = document.getElementById('monthBody');
            head.innerHTML = '<th>Branch</th><th>Staff Name</th>';
            for(let i=1; i<=daysInMonth; i++) head.innerHTML += `<th>${i}</th>`;

            const attSnap = await getDocs(collection(db, "daily_attendance"));
            body.innerHTML = '';
            
            // Simplified loop to populate grid
            allEmployees.forEach(emp => {
                let row = `<tr><td>${emp.branch}</td><td>${emp.name}</td>`;
                for(let i=1; i<=daysInMonth; i++) {
                    let d = `${monthVal}-${String(i).padStart(2,'0')}`;
                    let status = '-';
                    attSnap.forEach(snap => {
                        let data = snap.data();
                        if(data.empId === emp.id && data.date === d) status = data.status[0]; // P/A/L/H
                    });
                    row += `<td class="st-${status}">${status}</td>`;
                }
                body.innerHTML += row + '</tr>';
            });
        }
    </script>
</div>
</body>
</html>
